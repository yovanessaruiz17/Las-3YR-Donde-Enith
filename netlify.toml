# ==============================================================================
# CONFIGURACIÓN DE DESPLIEGUE EN NETLIFY — LAS 3YR (DONDE ENITH)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Redirección SPA para soportar rutas de React Router (evita errores 404 al recargar)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados HTTP de seguridad y rendimiento
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
