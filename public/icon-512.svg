<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A33" />
      <stop offset="50%" stop-color="#163E2B" />
      <stop offset="100%" stop-color="#0E281C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="50%" stop-color="#D83173" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(244, 143, 177, 0.25)" stroke-width="3" />

  <!-- Botanical & Sparkle decorative stars -->
  <!-- Top Right Sparkle -->
  <path d="M400 90 Q400 120 430 120 Q400 120 400 150 Q400 120 370 120 Q400 120 400 90 Z" fill="url(#goldGrad)" />
  <circle cx="435" cy="85" r="4" fill="#FFE082" />
  <circle cx="360" cy="155" r="3" fill="#F48FB1" />

  <!-- Bottom Left Sparkle -->
  <path d="M110 380 Q110 400 130 400 Q110 400 110 420 Q110 400 90 400 Q110 400 110 380 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Central Emblem / Monogram -->
  <!-- Subtle circular halo -->
  <circle cx="256" cy="235" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Main Text "Las 3YR" -->
  <text x="256" y="195" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="#FBF8F5" text-anchor="middle" letter-spacing="1">
    Las
  </text>
  <text x="256" y="275" font-family="'Playfair Display', Georgia, serif" font-size="88" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    3YR
  </text>

  <!-- Divider Ribbon -->
  <line x1="160" y1="320" x2="352" y2="320" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="256" cy="320" r="4.5" fill="#FFE082" />

  <!-- Subtitle "DONDE ENITH" -->
  <text x="256" y="358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#F48FB1" text-anchor="middle" letter-spacing="7">
    DONDE ENITH
  </text>

  <!-- City Subtitle "CARTAGENA" -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#C8E6C9" text-anchor="middle" letter-spacing="4" opacity="0.85">
    CARTAGENA DE INDIAS
  </text>
</svg>
